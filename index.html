<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ascii_Darshan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Share Tech Mono', monospace;
        background-color: #000;
        color: #0f0;
        overflow: hidden;
      }
      /* Custom scrollbar for cyberpunk feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #001100;
      }
      ::-webkit-scrollbar-thumb {
        background: #004400;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #008800;
      }
      
      /* CRT Screen Effect Overlay */
      body::after {
        content: " ";
        display: block;
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 999;
        background-size: 100% 3px, 3px 100%;
        pointer-events: none;
      }
      
      /* CRT flickering scanlines */
      @keyframes crt-flicker {
        0% { opacity: 0.975; }
        50% { opacity: 1.0; }
        100% { opacity: 0.985; }
      }
      body {
        animation: crt-flicker 0.15s infinite;
      }
    </style>
